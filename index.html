<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中科大六日午餐小地圖 🍱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-badge" aria-hidden="true">🍙</span>
        <div>
          <h1>中科大六日午餐小地圖</h1>
          <p class="subtitle">一中街（三民校區步行）· 第二／第五市場（民生校區步行）</p>
        </div>
      </div>

      <nav class="main-nav" aria-label="主導覽">
        <button type="button" class="nav-btn active" data-view="explore" id="navExplore">
          <span>🍽️ 逛美食</span>
        </button>
        <button type="button" class="nav-btn" data-view="favorites" id="navFavorites">
          <span>💖 我的收藏</span>
          <span class="badge-count" id="favCountBadge">0</span>
        </button>
        <button type="button" class="nav-btn add-store-nav-btn" id="openAddStoreBtn">
          <span>➕ 新增店家</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <!-- 區域選擇：一中街（三民校區步行計算）／第二市場、第五市場（民生校區步行計算） -->
    <section class="campus-section" aria-label="區域選擇">
      <div class="campus-switcher campus-switcher-3" role="tablist" aria-label="切換美食區域">
        <button type="button" class="campus-card active" data-campus="yizhong" role="tab" aria-selected="true">
          <span class="campus-emoji" aria-hidden="true">🏫</span>
          <div>
            <div class="campus-title-row">
              <h2>一中街</h2>
              <span class="campus-tag">三民校區步行計</span>
            </div>
            <p>從三民校區大門出發</p>
          </div>
        </button>

        <button type="button" class="campus-card" data-campus="market2" role="tab" aria-selected="false">
          <span class="campus-emoji" aria-hidden="true">🏮</span>
          <div>
            <div class="campus-title-row">
              <h2>第二市場</h2>
              <span class="campus-tag">民生校區步行計</span>
            </div>
            <p>從民生校區大門出發</p>
          </div>
        </button>

        <button type="button" class="campus-card" data-campus="market5" role="tab" aria-selected="false">
          <span class="campus-emoji" aria-hidden="true">🌿</span>
          <div>
            <div class="campus-title-row">
              <h2>第五市場</h2>
              <span class="campus-tag">民生校區步行計</span>
            </div>
            <p>從民生校區大門出發</p>
          </div>
        </button>
      </div>
    </section>

    <!-- 探索午餐頁面 -->
    <section id="exploreView" class="view-panel active">
      <div class="controls-panel">
        <div class="controls-row">
          <div class="pill-group" role="group" aria-label="選擇週六或週日中午">
            <button type="button" class="pill-btn active" data-day="sat">☀️ 週六中午</button>
            <button type="button" class="pill-btn" data-day="sun">🌤️ 週日中午</button>
          </div>

          <div class="pill-group" role="group" aria-label="正餐與點心飲料分開點選">
            <button type="button" class="pill-btn category-meal active" data-category="meal">🍱 150元內正餐</button>
            <button type="button" class="pill-btn category-drink" data-category="snackdrink">🍡 點心＋手搖飲</button>
          </div>

          <div class="pill-group" role="group" aria-label="排序方式">
            <button type="button" class="pill-btn active" data-sort="rating">⭐ 評價高→低</button>
            <button type="button" class="pill-btn" data-sort="distance">🚶 距離近→遠</button>
          </div>
        </div>

        <div class="controls-meta">
          <div class="result-summary" id="resultSummary">載入中...</div>
          <div class="meta-right">
            <a
              id="exploreMoreMapsLink"
              class="explore-maps-btn"
              href="https://www.google.com/maps"
              target="_blank"
              rel="noopener noreferrer"
              title="在 Google 地圖查看附近更多營業中店家"
            >
              🗺️ 地圖找更多 ↗
            </a>
          </div>
        </div>

        <div class="hidden-bar" id="hiddenBar" hidden>
          <span id="hiddenBarText"></span>
          <button type="button" class="restore-btn" id="restoreHiddenBtn">全部還原</button>
        </div>
      </div>

      <div id="storeGrid" class="store-grid" aria-live="polite"></div>
    </section>

    <!-- 個人收藏店家頁面 -->
    <section id="favoritesView" class="view-panel" hidden>
      <div class="favorites-header">
        <div>
          <h2>💖 我的收藏店家</h2>
          <p class="favorites-desc">喜歡的六日午餐、點心與飲料都在這裡</p>
        </div>
        <div class="pill-group" role="group" aria-label="收藏區域篩選">
          <button type="button" class="pill-btn active" data-fav-campus="all">全部</button>
          <button type="button" class="pill-btn" data-fav-campus="yizhong">一中街</button>
          <button type="button" class="pill-btn" data-fav-campus="market2">第二市場</button>
          <button type="button" class="pill-btn" data-fav-campus="market5">第五市場</button>
        </div>
      </div>

      <div id="favoritesGrid" class="store-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>中科大六日午餐小地圖 · 可隨時按「➕ 新增店家」擴充口袋名單，或按「🚫」回報歇業／超預算店家</p>
    </div>
  </footer>

  <!-- 新增店家 Modal -->
  <div class="modal-backdrop" id="addStoreModal" hidden role="dialog" aria-modal="true" aria-labelledby="addStoreTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="addStoreTitle">➕ 推薦新店家</h3>
        <button type="button" class="icon-action-btn" id="closeAddStoreBtn" aria-label="關閉視窗">✕</button>
      </div>
      <form id="addStoreForm" class="modal-form">
        <div class="form-grid-2">
          <label class="field-label">
            區域
            <select name="campus" required>
              <option value="yizhong">🏫 一中街（三民校區計距）</option>
              <option value="market2">🏮 第二市場（民生校區計距）</option>
              <option value="market5">🌿 第五市場（民生校區計距）</option>
            </select>
          </label>
          <label class="field-label">
            分類
            <select name="category" id="newStoreCategory" required>
              <option value="meal">🍱 150元內正餐</option>
              <option value="snackdrink">🍡 點心＋手搖飲</option>
            </select>
          </label>
        </div>

        <label class="field-label">
          店名
          <input type="text" name="name" placeholder="例如：阿明乾麵／茶湯會" maxlength="40" required />
        </label>

        <label class="field-label">
          地址（用來產生 Google 地圖連結）
          <input type="text" name="address" placeholder="例如：臺中市北區三民路三段120號" maxlength="80" required />
        </label>

        <div class="form-grid-3">
          <label class="field-label">
            步行分鐘（從校區大門）
            <input type="number" name="walkMinutes" min="1" max="15" value="5" required />
          </label>
          <label class="field-label">
            最高價（元）
            <input type="number" name="maxPrice" id="newStoreMaxPrice" min="10" max="150" value="100" required />
          </label>
          <label class="field-label">
            評價（選填）
            <input type="number" name="rating" min="1" max="5" step="0.1" value="4.5" />
          </label>
        </div>

        <div class="form-grid-2">
          <label class="field-label">
            ☀️ 週六營業（留空＝公休）
            <input type="text" name="satHours" value="11:00–14:00" placeholder="例如 11:00–14:00 或留空" />
          </label>
          <label class="field-label">
            🌤️ 週日營業（留空＝公休）
            <input type="text" name="sunHours" value="11:00–14:00" placeholder="例如 11:00–14:00 或留空" />
          </label>
        </div>

        <label class="field-label">
          招牌推薦（逗號分隔，最多2個）
          <input type="text" name="highlights" placeholder="例如：滷肉飯, 貢丸湯" maxlength="40" />
        </label>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelAddStoreBtn">取消</button>
          <button type="submit" class="btn-primary">加入清單</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 右下角可愛小姐小客服 -->
  <div class="chat-widget" id="chatWidget">
    <div class="chat-panel" id="chatPanel" hidden aria-label="AI 午餐小客服視窗">
      <div class="chat-header">
        <div class="chat-header-title">
          <svg class="mini-smiley" viewBox="0 0 80 80" width="34" height="34" aria-hidden="true">
            <defs>
              <clipPath id="girlMiniClip">
                <circle cx="40" cy="40" r="33.5" />
              </clipPath>
            </defs>
            <circle cx="40" cy="40" r="35" fill="#FFE9DC" stroke="#4A3728" stroke-width="3.2" />
            <g clip-path="url(#girlMiniClip)">
              <path d="M16 44 C15 21, 25 11, 40 11 C55 11, 65 21, 64 44 C64 56, 59 64, 53 68 L27 68 C21 64, 16 56, 16 44 Z" fill="#6D4735" />
              <path d="M20 75 C21 61, 30 57, 40 57 C50 57, 59 61, 60 75 Z" fill="#FF8C73" />
              <path d="M32 57 L40 65 L48 57 Q40 59 32 57 Z" fill="#FFFFFF" />
              <rect x="36" y="51" width="8" height="8" rx="3" fill="#FFE5D0" />
              <circle cx="22.5" cy="40" r="3.4" fill="#FFE5D0" />
              <circle cx="57.5" cy="40" r="3.4" fill="#FFE5D0" />
              <ellipse cx="40" cy="39" rx="16.5" ry="17" fill="#FFE5D0" />
              <path d="M23 33 C25 21, 32 17, 40 18 C48 17, 55 21, 57 33 C52 27, 46 25, 40 28 C34 25, 28 27, 23 33 Z" fill="#6D4735" />
              <rect x="48.5" y="21" width="7.5" height="3.2" rx="1.6" transform="rotate(14 52 22.5)" fill="#FF9EB5" />
              <circle cx="33" cy="37.5" r="2.6" fill="#4A3728" />
              <circle cx="47" cy="37.5" r="2.6" fill="#4A3728" />
              <circle cx="33.9" cy="36.6" r="0.9" fill="#FFFFFF" />
              <circle cx="47.9" cy="36.6" r="0.9" fill="#FFFFFF" />
              <path d="M29.8 36.2 Q30.8 35.2 32 35.8" fill="none" stroke="#4A3728" stroke-width="1.4" stroke-linecap="round" />
              <path d="M48 35.8 Q49.2 35.2 50.2 36.2" fill="none" stroke="#4A3728" stroke-width="1.4" stroke-linecap="round" />
              <ellipse cx="28.5" cy="42.5" rx="3.8" ry="2.1" fill="#FFA4AD" opacity="0.72" />
              <ellipse cx="51.5" cy="42.5" rx="3.8" ry="2.1" fill="#FFA4AD" opacity="0.72" />
              <path d="M35.5 45.2 Q40 48.2 44.5 45.2" fill="none" stroke="#4A3728" stroke-width="2.2" stroke-linecap="round" />
            </g>
            <circle cx="40" cy="40" r="35" fill="none" stroke="#4A3728" stroke-width="3.2" />
          </svg>
          <div>
            <strong>午餐小客服</strong>
            <span class="gas-status" id="gasStatusText">尚未設定 GAS 網址</span>
          </div>
        </div>
        <div class="chat-header-actions">
          <button type="button" class="icon-action-btn" id="openSettingsBtn" title="設定 GAS 網址" aria-label="設定 GAS 網址">
            ⚙️ 設定
          </button>
          <button type="button" class="icon-action-btn close-chat-btn" id="closeChatBtn" title="縮小視窗" aria-label="關閉小客服">
            ✕
          </button>
        </div>
      </div>

      <!-- GAS 設定區塊 -->
      <div class="chat-settings" id="chatSettings" hidden>
        <label for="gasUrlInput" class="settings-label">貼上 Google Apps Script (GAS) 部署網址</label>
        <input
          type="url"
          id="gasUrlInput"
          class="settings-input"
          placeholder="https://script.google.com/macros/s/.../exec"
        />
        <p class="settings-hint">
          金鑰請放在 GAS 指令碼屬性（<code>OPENROUTER_API_KEY</code>）；設定後也可同步大家的新增店家與留言！
        </p>
        <div class="settings-actions">
          <button type="button" class="btn-secondary" id="testGasBtn">測試連線</button>
          <button type="button" class="btn-primary" id="saveGasBtn">儲存網址</button>
        </div>
        <div class="settings-feedback" id="settingsFeedback" aria-live="polite"></div>
      </div>

      <!-- 對話訊息區 -->
      <div class="chat-messages" id="chatMessages"><div class="chat-msg bot">嗨嗨～我是午餐小客服 😊<br />點右上角 <strong>⚙️ 設定</strong> 貼上 GAS 網址，就能請我幫你挑午餐囉！</div></div>

      <!-- 快捷提問 -->
      <div class="chat-quick-prompts" id="quickPrompts">
        <button type="button" class="quick-chip" data-prompt="推薦目前區域與時段，高評價又近的 150 元內正餐">🍱 推薦正餐</button>
        <button type="button" class="quick-chip" data-prompt="幫我配一組正餐＋點心或手搖飲">🍡 幫我配一組</button>
        <button type="button" class="quick-chip" data-prompt="哪幾家店週日沒開？">📅 週日公休</button>
      </div>

      <!-- 輸入列 -->
      <form class="chat-input-form" id="chatForm">
        <input
          type="text"
          id="chatInput"
          placeholder="想吃什麼呢？問問小客服..."
          autocomplete="off"
          required
        />
        <button type="submit" class="chat-send-btn" id="chatSendBtn">送出</button>
      </form>
    </div>

    <!-- 可愛小姐微微笑浮動按鈕 -->
    <button type="button" class="smiley-launcher" id="smileyLauncher" aria-label="開啟午餐小客服" title="點我開啟午餐小客服">
      <svg class="smiley-face-svg" viewBox="0 0 80 80" width="66" height="66" aria-hidden="true">
        <defs>
          <clipPath id="girlAvatarClip">
            <circle cx="40" cy="40" r="33.5" />
          </clipPath>
        </defs>
        <circle cx="40" cy="40" r="35" fill="#FFE9DC" />
        <g clip-path="url(#girlAvatarClip)">
          <path d="M16 44 C15 21, 25 11, 40 11 C55 11, 65 21, 64 44 C64 56, 59 64, 53 68 L27 68 C21 64, 16 56, 16 44 Z" fill="#6D4735" />
          <path d="M20 75 C21 61, 30 57, 40 57 C50 57, 59 61, 60 75 Z" fill="#FF8C73" />
          <path d="M32 57 L40 65 L48 57 Q40 59 32 57 Z" fill="#FFFFFF" />
          <rect x="36" y="51" width="8" height="8" rx="3" fill="#FFE5D0" />
          <circle cx="22.5" cy="40" r="3.4" fill="#FFE5D0" />
          <circle cx="57.5" cy="40" r="3.4" fill="#FFE5D0" />
          <ellipse cx="40" cy="39" rx="16.5" ry="17" fill="#FFE5D0" />
          <path d="M23 33 C25 21, 32 17, 40 18 C48 17, 55 21, 57 33 C52 27, 46 25, 40 28 C34 25, 28 27, 23 33 Z" fill="#6D4735" />
          <rect x="48.5" y="21" width="7.5" height="3.2" rx="1.6" transform="rotate(14 52 22.5)" fill="#FF9EB5" />
          <circle cx="33" cy="37.5" r="2.6" fill="#4A3728" />
          <circle cx="47" cy="37.5" r="2.6" fill="#4A3728" />
          <circle cx="33.9" cy="36.6" r="0.9" fill="#FFFFFF" />
          <circle cx="47.9" cy="36.6" r="0.9" fill="#FFFFFF" />
          <path d="M29.8 36.2 Q30.8 35.2 32 35.8" fill="none" stroke="#4A3728" stroke-width="1.4" stroke-linecap="round" />
          <path d="M48 35.8 Q49.2 35.2 50.2 36.2" fill="none" stroke="#4A3728" stroke-width="1.4" stroke-linecap="round" />
          <ellipse cx="28.5" cy="42.5" rx="3.8" ry="2.1" fill="#FFA4AD" opacity="0.72" />
          <ellipse cx="51.5" cy="42.5" rx="3.8" ry="2.1" fill="#FFA4AD" opacity="0.72" />
          <path d="M35.5 45.2 Q40 48.2 44.5 45.2" fill="none" stroke="#4A3728" stroke-width="2.1" stroke-linecap="round" />
        </g>
        <circle cx="40" cy="40" r="35" fill="none" stroke="#4A3728" stroke-width="3.2" />
      </svg>
      <span class="launcher-label">小客服</span>
    </button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
